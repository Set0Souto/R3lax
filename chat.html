<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat | R3Lax</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="b00k.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="sidebar-toggle" aria-label="Toggle side navigation">☰</button>

    <nav>
        <a href="index.html">Home</a>
        <a href="pomodoro.html">Pomodoro</a>
        <a href="music.html">Music</a>
        <a href="calendar.html">Management</a>
        <a class="active" href="chat.html" aria-current="page">Chat</a>
        <a href="settings.html">Settings</a>
        <a href="login.html">Test ahhh</a>
    </nav>

    <main class="chat-access-gate" id="chat-access-gate" aria-live="polite">
        <div class="chat-access-card">
            <div class="chat-lock" aria-hidden="true">🔒</div>
            <h1 id="chat-access-heading">Checking sign-in...</h1>
            <p id="chat-access-message">Please wait while we verify your account.</p>
            <a class="chat-login-link hidden" id="chat-login-link" href="login.html?redirect=chat.html">Sign in to use Chat</a>
        </div>
    </main>

    <main class="chat-messages hidden" id="message-list">
        
        <div class="chat-recieved">
            <p>Welcome to the Chat! dumbass I love minecraft and I completely frogot lmaooo fuckkk</p>
            <span class="timestamp">12:00 PM</span>
        </div>
        <div class="chat-sent">
            <p>Thanks!</p>
            <span class="timestamp">12:00 PM</span>
        </div>
        <form class="chat-input-bar" id="chat-form">
        
            <input
        type="text"
        id="message-input"
        placeholder="Type your message..."
        autocomplete="off"
        required
        />
        <button3 type="submit" id="send-button" aria-label="Send message">
            <img src="send.png" alt="">
        </button3>
    </form>
    </main>

    <div class="bottom-player-bar hidden">
        <audio id="music-player" preload="metadata"></audio>
        <div class="bottom-player-controls">
            <button id="prev-btn" class="control-btn">Previous</button>
            <button id="play-pause-btn" class="control-btn">Play</button>
            <button id="stop-btn" class="control-btn">Stop</button>
            <button id="next-btn" class="control-btn">Next</button>
        </div>
        <div class="bottom-player-progress">
            <div class="track-progress-header">
                <div class="track-progress-label">Listened</div>
                <div class="track-time">
                    <span id="current-time">00:00</span>
                    <span class="track-time-separator">/</span>
                    <span id="track-duration">00:00</span>
                </div>
            </div>
            <input id="track-progress" type="range" min="0" max="100" step="0.1" value="0" aria-label="Track progress">
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCPEOFfR1kW2NQ3cWlTLQjJfpjlgCTQDPk",
            authDomain: "r3lax-ppw14.firebaseapp.com",
            projectId: "r3lax-ppw14",
            storageBucket: "r3lax-ppw14.firebasestorage.app",
            messagingSenderId: "495353535290",
            appId: "1:495353535290:web:958d1ef38a6ba429460e03",
        };

        firebase.initializeApp(firebaseConfig);
        const chatAuth = firebase.auth();
        const chatAccessGate = document.getElementById('chat-access-gate');
        const chatAccessHeading = document.getElementById('chat-access-heading');
        const chatAccessMessage = document.getElementById('chat-access-message');
        const chatLoginLink = document.getElementById('chat-login-link');
        const messageList = document.getElementById('message-list');

        chatAuth.onAuthStateChanged((user) => {
            if (user) {
                chatAccessGate.classList.add('hidden');
                messageList.classList.remove('hidden');
                return;
            }

            chatAccessHeading.textContent = 'Sign in required';
            chatAccessMessage.textContent = 'Please sign in to use the chat feature.';
            chatLoginLink.classList.remove('hidden');
        }, (error) => {
            console.error('Unable to verify sign-in status:', error);
            chatAccessHeading.textContent = 'Unable to check sign-in';
            chatAccessMessage.textContent = 'Refresh the page and try again.';
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
