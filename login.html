<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login to R3Lax</title>
        <link rel="icon" href="b00k.png" type="image/png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="login-page">
    <div class="love">
        <h5>Where we Relax.</h5>
        <p class="mouse">Welcome to R3lax, where focus is the key to productivity and success. Chill with relaxing music and focus with pomodoro timer.</p>
    </div>
    
    <div class="me"> 
            <h2 id="login-heading">Hello, welcome back!</h2>
            <p id="login-subheading">Sign in to unlock Chat, or continue without an account.</p>
            <form id="loginForm">
                <label for="email">Email Address</label>
                <input type="text" id="email" placeholder="you@example.com" required />
                
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required />
                
                <button type="submit" class="button2">Sign In</button>
                <a href="index.html">Continue without Login</a>
            </form>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        // REPLACE THESE VALUES WITH YOUR ACTUAL FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyCPEOFfR1kW2NQ3cWlTLQjJfpjlgCTQDPk",
            authDomain: "r3lax-ppw14.firebaseapp.com",
            projectId: "r3lax-ppw14",
            storageBucket: "r3lax-ppw14.firebasestorage.app",
            messagingSenderId: "495353535290",
            appId: "1:495353535290:web:958d1ef38a6ba429460e03",
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (email === '' || password === '') {
                alert('Please enter your email and password.');
                return;
            }

            // Actual Firebase Sign-In
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const redirect = new URLSearchParams(window.location.search).get('redirect');
                    window.location.href = redirect === 'chat.html' ? redirect : 'index.html';
                })
                .catch((error) => {
                    // Handle errors
                    console.error("Login error:", error.code);
                    if (error.code === 'auth/invalid-email') {
                        alert('Please enter a valid email address.');
                    } else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        alert('Invalid email or password.');
                    } else {
                        alert('An error occurred: ' + error.message);
                    }
                });
        });
    </script>
    </body>
</html>
