<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login to R3Lax</title>
        <link rel="icon" href="b00k.png" type="image/png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="login-page">
    <div class="love">
        <h5>Where we Relax.</h5>
        <p class="mouse">Welcome to R3lax, where focus is the key to productivity and success. Chill with relaxing music and focus with pomodoro timer.</p>
    </div>
    
    <div class="me"> 
            <h2 id="login-heading">Hello, welcome back!</h2>
            <p id="login-subheading">Please sign in to access the page.</p>
            <form id="loginForm">
                <lable for="email">Email Address</lable>
                <input type="email" id="email" placeholder="you@example.com" required />
                
                <lable for="password">Password</lable>
                <input type="password" id="password" placeholder="••••••••" required />
                <button2 type="submit">Sign In</button2>
            </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'index.html';
        });

        // Make button2 work as a submit button
        const button2 = document.querySelector('button2');
        if (button2) {
            button2.addEventListener('click', function() {
                document.getElementById('loginForm').submit();
            });
        }
    </script>
    </body>
</html>
