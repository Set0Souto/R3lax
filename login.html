<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login to R3Lax</title>
        <link rel="icon" href="b00k.png" type="image/png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="login-page">
    <div class="love">
        <h5>Where we Relax.</h5>
        <p class="mouse">Welcome to R3lax, where focus is the key to productivity and success. Chill with relaxing music and focus with pomodoro timer.</p>
    </div>
    
    <div class="me"> 
            <h2 id="login-heading">Hello, welcome back!</h2>
            <p id="login-subheading">Please sign in to access the page.</p>
            <form id="loginForm">
                <label for="email">Email Address</label>
                <input type="text" id="email" placeholder="you@example.com" required />
                
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required />
                
                <button type="submit" class="button2">Sign In</button>
            </form>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (email !== '' && password !== '') {
                window.location.href = 'index.html';
            } else {
                alert('Please enter your email and password.');
            }
        });
    </script>
    </body>
</html>
