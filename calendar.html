<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calendar | R3Lax</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="b00k.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="sidebar-toggle" aria-label="Toggle side navigation">☰</button>

    <nav>
        <a href="index.html">Home</a>
        <a href="pomodoro.html">Pomodoro</a>
        <a href="music.html">Music</a>
        <a class="active" href="calendar.html" aria-current="page">Management</a>
        <a href="chat.html">Chat</a>
        <a href="settings.html">Settings</a>
        <a href="login.html">Test ahhh</a>
    </nav>

    <main class="calendar-page">
        <header class="calendar-heading">
            <div>
                <h1>Calendar</h1>
                <p id="selected-date" aria-live="polite"></p>
            </div>
            <div class="calendar-controls">
                <button id="calendar-today" type="button">Today</button>
                <button id="calendar-previous" type="button" aria-label="Previous month">&larr;</button>
                <h2 id="calendar-month" aria-live="polite"></h2>
                <button id="calendar-next" type="button" aria-label="Next month">&rarr;</button>
            </div>
        </header>
        <div class="calendar-grid" id="calendar-grid" aria-label="Calendar">
            <div class="calendar-weekday" aria-hidden="true">Sun</div>
            <div class="calendar-weekday" aria-hidden="true">Mon</div>
            <div class="calendar-weekday" aria-hidden="true">Tue</div>
            <div class="calendar-weekday" aria-hidden="true">Wed</div>
            <div class="calendar-weekday" aria-hidden="true">Thu</div>
            <div class="calendar-weekday" aria-hidden="true">Fri</div>
            <div class="calendar-weekday" aria-hidden="true">Sat</div>
            <div class="calendar-days" id="calendar-days"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
